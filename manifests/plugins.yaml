# Plugin manifest — groups each domain's skills into a per-product plugin.
# Covers every migrated domain; add a plugin entry here when a new domain ships.
#
# Schema: ../core/docs/schemas/plugins.schema.json
#
# Each entry MUST declare `id`, `domain`, `contained_skills`, and
# `product_manifests`. Plugin `domain` cross-references skill `domain`
# fields in `skills.yaml`.
schema_version: 1

plugins:
  - id: reporting
    domain: reporting
    contained_skills:
      - reporting.daily-brief
      - reporting.project-retro
      - reporting.topic-radar
    product_manifests:
      codex: targets/codex/plugins/reporting/.codex-plugin/plugin.json
      claude: targets/claude/plugins/reporting/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/reporting/.hermes-plugin/plugin.json
    install_policy: always

  - id: meta
    domain: meta
    contained_skills:
      - meta.bootstrap
      - meta.deploy
      - meta.create-skill
      - meta.create-project-skill
      - meta.remove-skill
      - meta.remove-project-skill
      - meta.repo-docs-boundary
      - meta.sync-runtime-surfaces
      - meta.release
      - meta.setup-project
      - meta.nils-cli-bump
      - meta.worktree-triage
    product_manifests:
      codex: targets/codex/plugins/meta/.codex-plugin/plugin.json
      claude: targets/claude/plugins/meta/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/meta/.hermes-plugin/plugin.json
    install_policy: always

  - id: media
    domain: media
    contained_skills:
      - media.image-processing
      - media.screen-record
    product_manifests:
      codex: targets/codex/plugins/media/.codex-plugin/plugin.json
      claude: targets/claude/plugins/media/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/media/.hermes-plugin/plugin.json
    install_policy: always

  - id: computer-use
    domain: computer-use
    contained_skills:
      - computer-use.macos-desktop
    product_manifests:
      codex: targets/codex/plugins/computer-use/.codex-plugin/plugin.json
      claude: targets/claude/plugins/computer-use/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/computer-use/.hermes-plugin/plugin.json
    install_policy: always

  - id: conversation
    domain: conversation
    contained_skills:
      - conversation.discussion-to-implementation-doc
      - conversation.guided-feature-build
      - conversation.handoff-session-prompt
    product_manifests:
      codex: targets/codex/plugins/conversation/.codex-plugin/plugin.json
      claude: targets/claude/plugins/conversation/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/conversation/.hermes-plugin/plugin.json
    install_policy: always

  - id: issue
    domain: issue
    contained_skills:
      - issue.issue-follow-up
      - issue.issue-triage
    product_manifests:
      codex: targets/codex/plugins/issue/.codex-plugin/plugin.json
      claude: targets/claude/plugins/issue/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/issue/.hermes-plugin/plugin.json
    install_policy: always

  - id: code-review
    domain: code-review
    contained_skills:
      - code-review.code-review-specialists
    product_manifests:
      codex: targets/codex/plugins/code-review/.codex-plugin/plugin.json
      claude: targets/claude/plugins/code-review/.claude-plugin/plugin.json
      hermes: targets/hermes/plugins/code-review/.hermes-plugin/plugin.json
    install_policy: always

  - id: pr
    domain: pr
    contained_skills:
      - pr.deliver-pr
    product_manifests:
      codex: targets/codex/plugins/pr/.codex-plugin/plugin.json
      claude: targets/claude/plugins/pr/.claude-plugin/plugin.json
