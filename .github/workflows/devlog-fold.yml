name: Devlog fold

on:
  workflow_call:
    inputs:
      log-dir:
        type: string
        default: docs/devlog
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  fold:
    # The centrally supplied switch is off when absent. Do not set repo overrides
    # outside an explicitly isolated acceptance fixture.
    if: vars.AGENT_RUNTIME_DEVLOG_FRAGMENTS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: devlog-fold-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Resolve this reusable workflow's immutable source
        id: source
        run: |
          python3 - <<'PY_SOURCE'
          import base64, json, os, re, urllib.request
          # Fetch the claim directly from GitHub's authenticated HTTPS OIDC
          # endpoint; neither the token nor request authorization is logged.
          request = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=devlog-fold-source',
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          encoded = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(encoded + '=' * (-len(encoded) % 4)))
          owner = 'sympoies/agent-runtime-kit/.github/workflows/devlog-fold.yml'
          if claims.get('job_workflow_ref', '').split('@')[0] != owner:
              raise SystemExit('Unexpected reusable workflow owner')
          sha = claims.get('job_workflow_sha', '')
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Missing immutable reusable workflow revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY_SOURCE
      - name: Checkout trusted kit owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sympoies/agent-runtime-kit
          ref: ${{ steps.source.outputs.sha }}
          path: kit
          persist-credentials: false
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve checksum-pinned fold tools without the App token
        env:
          GH_TOKEN: ${{ github.token }}
          NILS_RELEASE_SHA256: facda9a4af8980df8b929af41e41e5bd4d9f34c0134599ca564d416e55a3fdad
        run: |
          set -euo pipefail
          bindir="$(bash kit/scripts/dev/with-nils-version.sh release:v1.31.14)"
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"
      - name: Mint repository-scoped fold token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Fold and publish a verified commit
        working-directory: repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_RUNTIME_DEVLOG_FRAGMENTS: ${{ vars.AGENT_RUNTIME_DEVLOG_FRAGMENTS }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOG_DIR: ${{ inputs.log-dir }}
        run: |
          set -euo pipefail
          python3 ../kit/scripts/ci/devlog-fold.py \
              --repo "$GITHUB_REPOSITORY" --branch "$DEFAULT_BRANCH" --dir "$LOG_DIR"
