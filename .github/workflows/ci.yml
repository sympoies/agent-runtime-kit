name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-stack:
    name: scripts/ci/all.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Retirement digest acceptance replays the immutable pre-retirement
          # golden-tree revision instead of retaining retired skill content.
          fetch-depth: 0

      - name: Resolve nils-cli pin
        id: pin
        run: |
          set -euo pipefail
          PIN="$(sed -n -E 's/^[[:space:]]*pinned_tag:[[:space:]]*"?([^"#]+)"?.*/\1/p' \
            docs/source/nils-cli-pin.yaml | head -1 | tr -d '[:space:]')"
          test -n "$PIN"
          echo "tag=$PIN" >> "$GITHUB_OUTPUT"
          echo "nils-cli pin: $PIN"

      # Cache the extracted, pinned nils-cli release surface so each run reuses
      # the prior `gh release download` instead of re-fetching the tarball. The
      # key is the pin tag, so a pin bump misses and re-populates automatically.
      # Path mirrors with-nils-version.sh's cache: $STATE_OUT/nils-versions/<tag>.
      - name: Cache nils-cli release surface
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/state/agent-runtime-kit/out/nils-versions/${{ steps.pin.outputs.tag }}
          key: nils-cli-${{ runner.os }}-${{ steps.pin.outputs.tag }}

      - name: Print toolchain versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "bash: $(bash --version | head -1)"
          echo "git: $(git --version)"
          scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- agent-runtime --version
          scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- plan-tooling --version

      - name: Run scripts/ci/all.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # Run the shared-hook suite serially on CI. Its process-sharding
          # (default: min(nproc,16)) is a real local speedup, but on the
          # 2-4 core hosted runner the oversubscribed hook subprocesses expose
          # a load-sensitive race in the dirty-checkout-adoption probes
          # (advisory intermittently empty). Serial here keeps CI reliable;
          # local runs keep the fast default. See issue #689.
          HOOKS_TEST_JOBS: "1"
        run: scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- bash scripts/ci/all.sh
