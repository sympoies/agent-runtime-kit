name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-stack:
    name: scripts/ci/all.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Retirement digest acceptance replays the immutable pre-retirement
          # golden-tree revision instead of retaining retired skill content.
          fetch-depth: 0

      - name: Resolve nils-cli pin
        id: pin
        run: |
          set -euo pipefail
          PIN="$(sed -n -E 's/^[[:space:]]*pinned_tag:[[:space:]]*"?([^"#]+)"?.*/\1/p' \
            docs/source/nils-cli-pin.yaml | head -1 | tr -d '[:space:]')"
          test -n "$PIN"
          echo "tag=$PIN" >> "$GITHUB_OUTPUT"
          echo "nils-cli pin: $PIN"

      - name: Print toolchain versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "bash: $(bash --version | head -1)"
          echo "git: $(git --version)"
          scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- agent-runtime --version
          scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- plan-tooling --version

      - name: Run scripts/ci/all.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev/with-nils-version.sh "release:${{ steps.pin.outputs.tag }}" -- bash scripts/ci/all.sh
