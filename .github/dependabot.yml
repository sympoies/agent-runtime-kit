version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  # The only npm manifest in this repo is the AI CLI pin set, and it is a
  # derived artifact of the product floor rather than an independently
  # upgradable dependency: `scripts/ci/security-hardening-audit.py` requires
  # `manifests/runtime-roots.yaml` `recommended_version`, the Dockerfile ARG,
  # `package.json`, and `package-lock.json` to agree, and that version moves in
  # lockstep with `min_version` and `min_version_effective_from` through
  # `.github/PULL_REQUEST_TEMPLATE/min-version-bump.md`. Dependabot updates
  # `package.json` and `package-lock.json` but can reach neither the Dockerfile
  # ARG nor `recommended_version`, so its PRs fail that audit every time. Both
  # packages are therefore ignored, and new releases are surfaced by
  # `scripts/ci/version-baseline-audit.py report` instead.
  #
  # An unversioned ignore also suppresses Dependabot security update PRs for
  # these two packages. That costs nothing here, because such a PR would fail
  # the same audit; Dependabot alerts still fire, and the response to one is a
  # floor bump through the ceremony above.
  #
  # The ecosystem entry itself stays because the same audit asserts that npm is
  # watched; drop these ignores only together with that rule.
  - package-ecosystem: npm
    directory: /docker/npm-cli-pins
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@anthropic-ai/claude-code"
      - dependency-name: "@openai/codex"
