# Hermes install link map.
#
# Schema: ../../core/docs/schemas/link-map.schema.json
#
# Hermes discovers skills from the local skills tree and configured external
# roots. Runtime-kit managed skills are installed under the external root so
# Hermes-native skills in ~/.hermes/skills stay separate from kit-owned files.
# There is no Hermes plugin marketplace — skills are standalone SKILL.md files.

schema_version: 1

entries:
  - id: reporting.plugin-manifest
    kind: plugin-manifest-copy
    source: targets/hermes/plugins/reporting/.hermes-plugin/plugin.json
    destination: plugins/reporting/.hermes-plugin/plugin.json

  - id: reporting.skills-tree
    kind: symlinked-file
    source: build/hermes/plugins/reporting/skills
    destination: external-skills/agent-runtime-kit/reporting
    recursive: true

  - id: meta.plugin-manifest
    kind: plugin-manifest-copy
    source: targets/hermes/plugins/meta/.hermes-plugin/plugin.json
    destination: plugins/meta/.hermes-plugin/plugin.json

  - id: meta.skills-tree
    kind: symlinked-file
    source: build/hermes/plugins/meta/skills
    destination: external-skills/agent-runtime-kit/meta
    recursive: true

  - id: media.plugin-manifest
