# This checkout can act as the home docs catalog when selected explicitly with
# `--docs-home` or by repository-owned integration. Hooks pass the
# `AGENT_DOCS_HOME` fallback as an explicit flag; setup selects its checkout root
# directly. An installed prompt symlink can take precedence for an unflagged
# manual CLI call.
# Keep repo-only requirements at `scope = "project"`; they apply to this
# repository and linked worktrees, but are skipped for unrelated projects.
#
# Use `scope = "home"` for docs that should be inherited by unrelated project
# repositories when this checkout is the selected docs home. Home entries are
# resolved from that root, so `path` must point at a tracked file here.
#
# Home-scope example:
#
# [[document]]
# context = "startup"
# scope = "home"
# path = "docs/source/<shared-home-scope-doc>.md"
# required = true
# when = "always"
# notes = "Cross-repo guidance inherited from the selected home docs catalog"

# Workflow-phase scoping (issue #601 P1 slice 3d): an optional `phase` (a string
# or array) narrows a project-dev document to one or more workflow phases so an
# edit is not forced to carry the delivery/review runbooks. A document with no
# `phase` applies to every phase (the safe superset). The pre-edit gate maps
# direct edits and generic mutation-capable shell to `edit`, and the governed
# delivery CLIs (semantic-commit/forge-cli/git-cli) to `delivery`; `review` docs
# are reached through explicit `--phase review` preflight, not the gate. Needs a
# phase-capable agent-docs (the pinned surface); on an older CLI the gate falls
# back to full project-dev. `scripts/ci/context-budget-audit.py` resolves this
# catalog through `agent-docs`; do not maintain a second hand-written mirror.
[[document]]
context = "project-dev"
scope = "project"
path = "DEVELOPMENT.md"
required = false
when = "path-exists:Cargo.toml || path-exists:package.json || path-exists:src/** || path-exists:scripts/ci/all.sh"
phase = ["edit", "delivery"]
notes = "Canonical repository orientation and contributor detail; read on demand when setup, CI structure, release boundaries, or unfamiliar repository conventions matter."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/work-tier-levels.md"
required = true
when = "always"
phase = "delivery"
notes = "Work-tier levels (L0-L3) for delivery-phase durable state: keep routine L0 internal and surface only L1+, provider delivery, or materially ambiguous escalation. Home-scoped so any project-dev work inherits it when this checkout is the docs home."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/git-delivery.md"
required = true
when = "always"
phase = "delivery"
notes = "Detailed Git/commit/delivery mechanics behind the AGENT_HOME.md hard gates: semantic-commit body gate, managed worktree paths, branch naming, label selection, and PR/MR body format. Home-scoped so any project-dev work inherits it when this checkout is the docs home."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/files-hooks-validation.md"
required = true
when = "always"
phase = ["edit", "delivery"]
notes = "Compact engineering edit contract: inspection, user-work preservation, behavior delta, regression-first proof or waiver, artifact safety, cross-repo boundaries, and final validation."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/evidence-control-plane.md"
required = true
when = "always"
phase = ["review", "delivery"]
notes = "Conditional durable evidence ownership for review, delivery gates, audits, handoffs, and event-driven closeout; ordinary edits use the compact engineering contract."

[[document]]
context = "project-dev"
scope = "project"
path = "docs/source/docs-placement-retention-policy-v1.md"
required = false
when = "always"
phase = "edit"
notes = "Canonical docs placement and retention reference; read on demand when adding, promoting, moving, indexing, or cleaning durable documentation."

# Optional (required = false): available and auditable, but not force-injected
# into every project-dev preflight. Relevant only when doing coupled nils-cli
# work; the canonical DEVELOPMENT.md links to it.
[[document]]
context = "project-dev"
scope = "project"
path = "docs/source/nils-cli-version-workflows.md"
required = false
when = "always"
phase = "edit"
notes = "Downgrade / coupled-dev / pin-bump workflows for running a non-pinned nils-cli surface (scripts/dev/with-nils-version.sh) without relaxing the version-alignment gate."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/review-thread-convergence.md"
required = false
when = "always"
phase = "review"
notes = "Provider-agnostic discipline for dispositioning provider review threads and converging post-merge bot-review fix loops: per-finding triage, the convergence/stopping rule, and concentrate-vs-converge. Home-scoped and optional — referenced by deliver-pr, code-review-specialists follow-up mode, and project-local review-cleanup outcomes when a thread sweep is active, not force-injected for every project-dev task."

[[document]]
context = "project-dev"
scope = "home"
path = "core/policies/code-review-delegation-codex.md"
required = true
when = "always"
phase = "review"
product = "codex"
notes = "Codex-only reviewer delegation requirement inherited by project-dev preflight; AGENT_HOME carries the concise always-on rendered Codex prompt policy, and Claude omits this doc."

# task-tools intent: external-fact awareness plus optional CLI-tooling catalog.
# Docs-only (no [[validation]] contract). Durable session-aware hooks expand it
# only after activation; older agent-docs releases retain the all-intents cue.
# Optional docs remain auditable and available through agent-docs.
[[document]]
context = "task-tools"
scope = "home"
path = "core/policies/external-facts.md"
required = true
when = "always"
notes = "External, unstable, or time-sensitive claims: when to run the task-tools preflight, source tags, authoritative sourcing, and which evidence/reporting skills to prefer. Home-scoped so any task-tools work inherits it when this checkout is the docs home."

[[document]]
context = "browser-test"
scope = "home"
path = "core/policies/browser-test-routing.md"
required = true
when = "always"
notes = "Select static HTTP, rendered browser, Playwright, or desktop execution according to the claim and retain only matching evidence."

[[document]]
context = "memory"
scope = "home"
path = "core/policies/memory.md"
required = true
when = "always"
notes = "Bounded startup and on-demand recall, producer candidate ownership, explicit promotion approval, product capability ceilings, and retired-reference audit routing."

[[document]]
context = "session-coordination"
scope = "home"
path = "core/policies/session-coordination.md"
required = true
when = "always"
notes = "Global work-authorization, peer-delivery cooperation, and collision-awareness boundary: material peer requests require a bounded disposition; advisory and unmanaged coordination need no claim, while explicit enforce owns claims, checkout leases, and recovery."

[[document]]
context = "task-tools"
scope = "home"
path = "core/policies/cli-tools.md"
required = false
when = "always"
notes = "Optional cross-project CLI tool catalog and recommended defaults (search, files, API exploration, structured data, etc.). Auditable through task-tools but not force-injected for every external-fact task."

# Per-intent validation contract: what must run before declaring a project-dev
# task done. Consumed by the finish-line gate via `preflight --intent
# project-dev --format json`; the gate blocks a stop when code was edited but
# `marker` is missing/stale, and a waiver releases it.
[[validation]]
context = "project-dev"
commands = ["bash scripts/ci/all.sh"]
marker = ".cache/agent-validation/project-dev.ok"
description = "Run the canonical kit gate stack once; it already includes hook, render, smoke, and context-budget coverage."

# Project-owned classification consumed by nils-cli's phase-aware test-first
# checks. Consuming repositories declare their own paths; unmatched files stay
# fail-closed instead of inheriting language-specific guesses from this kit.
[path_classes]
production = ["AGENT_DOCS.toml", "core/hooks/**", "core/skills/**/*.tera", "scripts/**", "targets/**", "manifests/**"]
test = ["tests/**"]
docs = ["AGENT_HOME.md", "README.md", "DEVELOPMENT.md", "SUPPORT_MATRIX.md", "core/policies/**", "core/skills/**/README.md", "core/skills/**/references/**", "docs/**"]
generated = ["build/**"]
unmatched = "unknown"
