# nils-cli version policy — machine-readable gate and packaging input.
#
# Consumed by `scripts/ci/all.sh` Position 1 through
#   agent-runtime doctor --class version-alignment --pin docs/source/nils-cli-pin.yaml
# (released in nils-cli v0.28.0, sympoies/nils-cli#636).
#
# Contract: `minimum_supported_tag` is the compatibility admission floor.
# A host below it blocks. `validated_tag` is the exact reproducibility and
# packaging target. A newer host is admitted with an explicit warning and must
# still complete the downstream behavioral gates. Ordinary release uptake
# moves validated only; minimum moves only when compatibility is intentionally
# retired (see the `meta:nils-cli-bump` skill).
#
# The human-readable surface snapshot — crate -> binary table, consumed
# surfaces, refresh procedure — stays in docs/source/nils-cli-surface.md.
# Keep both role cues there in lock-step with this manifest.
schema_version: 2

nils_cli:
  # Oldest released surface allowed to run this repository's behavior gates.
  # v1.27.16 is the first stable release that ships the exact-base forge
  # delivery contract and guarded persistent integration-branch sync surface.
  minimum_supported_tag: "v1.27.27"
  # Exact surface used by blocking validated CI and all packaged artifacts.
  validated_tag: "v1.27.29"
  # Release artifact SHA256 pins consumed by docker/build.sh and the GHCR
  # publish workflow. Keep these in lock-step with validated_tag so the Docker
  # image build verifies nils-cli against an in-repo digest, not only the
  # release sidecar downloaded from the same server.
  release_sha256:
    linux_amd64: "4a169d28032ace8e6d696c9385e3096dbea6e5e1ea17c492b9b0f4094f8b5f21"
    linux_arm64: "cd5f6910af6416255caad7877b24735028e5d396bb2f0ec9ad639b5f6f7daf5a"

# Optional per-binary floors for the downstream-consumed CLIs. nils-cli
# ships every crate in lock-step, so the two version roles above are the
# primary gate; these floors are a belt-and-suspenders guard against a
# partial release (e.g. the v0.25.7 partial bump) and document the minimum
# consumed surface each binary must satisfy. Values track the
# surface-introduction versions recorded in docs/source/nils-cli-surface.md.
required_clis:
  - bin: agent-hook       # strict shared policy/config control plane + setup-owned exact provider ingress + native aggregate-context preservation + typed post-allow agent-session coordination transaction + execution.read-only.v1 shadow evaluation
    min: "1.26.4"
  - bin: plan-issue       # tracking controller + execution-state sync/writeback + review evidence context gate + provider payload privacy gate + lifecycle mutation lock + unified terminal closeout rows
    min: "1.1.0"
  - bin: plan-tooling     # ledger-update / ledger-sync + exec-state-sync repair
    min: "1.0.1"
  - bin: agent-out        # canonical agent artifact allocator, including path-for compatibility for rendered state_out(...) skill instructions and reviewed cleanup plan/apply
    min: "1.19.3"
  - bin: forge-cli        # pr/issue lifecycle + label list/audit/ensure surfaces + provider payload privacy gate + GitLab MR check/merge API path + review-thread/task merge gates + exact requested-base binding across lookup/adopt/create readback/ready/merge + strict config-gated test-first evidence v2 consumption across create/adopt/dry-run/deliver + pr review-threads list/resolve/reply + fork-safe remote-derived --repo targeting + review outcome/issue mirror + native actionable review threads + native review summaries and config-gated observed review convergence + trusted-head native review binding + immutable-body guarded exact-node pending-review recovery + reviewed-head final-merge compare-and-swap + governed repo push-default direct-main delivery + durable review-loop ledger with faithful observe dry-run preflight
    min: "1.27.27"
  - bin: review-specialists # canonical provider-review report bundle and native-thread finding transport
    min: "1.27.27"
  - bin: test-first-evidence # durable v2 contract delta, grouped test impacts/dispositions, meaningful-red fields, waiver debt, scoped validation history, residual gaps, pre-edit/delivery checks, and readable-but-delivery-ineligible v1 diagnostics
    min: "1.21.19"
  - bin: plan-archive     # discover / migrate / refresh / query
    min: "0.25.5"
  - bin: agent-docs       # data-driven catalog + declared-intent preflight guard + product-scoped document/validation filtering (`--product`) with `agent-docs.preflight.v2` + durable product/session-scoped intent activation and path classification
    min: "1.21.17"
  - bin: agent-session    # authenticated managed-session work-context claims/checks, atomic mutation admission/completion/reconcile leases, private mailbox, body-free fixed notifications, and direct-terminal-safe session coordination
    min: "1.25.11"
  - bin: agent-memory     # 768-byte startup recall + exact optional agent scope + trusted agent roots + frontmatter-aware producer candidates + dry-run-first promotion/archive and strict audits
    min: "1.26.4"
  - bin: evidence         # durable usage evidence archive surface: migrate (--host + blocked-record handling), mixed skill-usage v1/v2 owner provenance, unclassified-host block, working_repo_roots identity rescue, cwd/origin + slug identity hardening, purge retention, home-relativized skill paths, and prune-source --archived-only
    min: "1.21.17"
  - bin: git-cli          # managed worktree add/list/remove/prune surface + governed dirty-checkout snapshot/adopt/revoke transactions + guarded same-name-upstream sync for persistent non-default integration branches
    min: "1.27.16"
  - bin: semantic-commit  # governed signed commits, including effect-based default-branch delivery classification
    min: "1.25.11"
  - bin: main-agent       # authenticated main-agent controller and worker lifecycle facade
    min: "1.25.11"
  - bin: heuristic-inbox  # deliver + --label: records-branch PR writeback + default slug auto-suffixing + operation-record lifecycle + normalized skill/workflow/intent usage owners for closeout promotion
    min: "1.21.17"
  - bin: zsh-kit          # runtime shell setup entrypoint + managed zshenv bootstrap for operator-supplied Zsh repos
    min: "1.0.9"
  - bin: agent-runtime    # schema-v2 version policy + home-prompt render, skills-manifest v2 diagnostics, and explicit prior-source ownership for portable stale-link pruning
    min: "1.25.0"
  - bin: macos-agent      # Peekaboo v4.2.2 adapter: locked backend lifecycle, local/SSH exec, MCP profiles, journal/redaction/replay, doctor, and transition-only v3 upgrade
    min: "1.27.3"
  - bin: docs-impact      # durable scan disposition record/show/verify workflow
    min: "1.21.17"
  - bin: skill-usage      # v2 skill/workflow/intent owner records with v1 compatibility
    min: "1.21.17"
